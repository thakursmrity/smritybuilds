<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case study library · smritybuilds</title>
<meta name="description" content="Product strategy case studies by Smrity, each worked from diagnosis to rollout.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><clipPath id='r'><rect width='64' height='64' rx='5'/></clipPath><g clip-path='url(%23r)'><rect width='64' height='64' fill='%235B3FA6'/><path d='M50 0 A50 50 0 0 0 0 50 L0 64 L64 64 L64 0 Z' fill='%23D6C8F7'/><circle cx='43' cy='43' r='12' fill='%23FFFFFF'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="case.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="../#home" aria-label="Smrity builds, home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><clipPath id="mk"><rect width="64" height="64" rx="5"/></clipPath><g clip-path="url(#mk)"><rect width="64" height="64" fill="#5B3FA6"/><path d="M50 0 A50 50 0 0 0 0 50 L0 64 L64 64 L64 0 Z" fill="#D6C8F7"/><circle cx="43" cy="43" r="12" fill="#FFFFFF"/></g></svg>
      <span>smritybuilds</span>
    </a>
    <nav class="nav" aria-label="Pages">
      <a href="../#home">Home</a><a href="../#work">Work</a><a href="../#builds" aria-current="page">Builds</a><a href="../#becoming">Becoming</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="lib-head">
    <div>
      <a class="crumb" href="../#builds">← Builds</a><br>
      <span class="eyebrow e-lilac">Case study library</span>
      <h1>How I think through products</h1>
    </div>
  </div>

  <nav class="cat-jump" id="catJump" aria-label="Categories"></nav>
  <div id="cats"></div>
</main>


<script>
/* ============================================================
   CATEGORIES: the kind of product. CASES: add an object, set its
   `category` to one of the ids below, and it appears as a card in
   that group. Give each case its own folder (uber/, zomato/) and a brand
   theme in case.css (.theme-<brand>) used on that page's <main>.
   Colors can be a token name from case.css or a hex value.
   ============================================================ */
const CATEGORIES = [
  { id: "marketplace", name: "Two-sided marketplace", color: "lilac",
    blurb: "Two groups that need each other, so every fix has to work for both sides at once.",
    examples: "Uber, Zomato, Airbnb", next: "Airbnb" },
  { id: "content", name: "Content and consumption", color: "rose",
    blurb: "Products people come back to for what they watch, hear or read. Habit and discovery decide everything.",
    examples: "Spotify, Netflix, YouTube", next: "Spotify" },
  { id: "utility", name: "Utility tool", color: "sky",
    blurb: "Products used to get a job done fast. Trust and accuracy matter more than delight.",
    examples: "Google Maps, Google Calendar", next: "Google Maps" },
  { id: "messaging", name: "Messaging and social", color: "mint",
    blurb: "Products where value grows with every person who joins. Network effects drive the metrics.",
    examples: "WhatsApp, LinkedIn", next: "WhatsApp" },
  { id: "commerce", name: "Commerce", color: "peach",
    blurb: "Products that sell things. Conversion, basket size and repeat purchase are the levers.",
    examples: "Amazon, Swiggy Instamart", next: "Amazon" }
];

const CASES = [
  {
    category: "marketplace",
    brand: "Zomato",
    title: "Bringing back the weekday lunch",
    type: "Product strategy",
    question: "Order growth is slowing. Users are still growing, but each one orders less often. As the PM, how would you lift order frequency?",
    colors: ["#E23744", "#F4727C", "#FBC9CD"],
    href: "zomato/",
    deck: "zomato-lunch-frequency.pdf"
  },
  {
    category: "marketplace",
    brand: "Uber",
    dark: true,
    title: "Winning back the daily commuter",
    type: "Product improvement",
    question: "How would you improve Uber?",
    colors: ["#111111", "#4A4A4A", "#BDBDBD"],
    href: "uber/"
  }
];

const C = (k) => (k.startsWith("#") ? k : `var(--${k})`);
const SHAPES = ["s-quarter", "s-half", "s-circle", "s-tri", "s-leaf"];
const pick = (a, i) => a[i % a.length];
function art(colors, seed) {
  let h = "";
  for (let k = 0; k < 9; k++) {
    const bg = colors[k % 3], fg = colors[(k + 1) % 3];
    const flip = pick(["none", "rotate(180deg)", "scaleX(-1)", "scaleY(-1)"], k * 7 + seed);
    h += `<div class="${pick(SHAPES, k * 3 + seed)}" style="background:${C(bg)};transform:${flip}"><i style="background:${C(fg)}"></i></div>`;
  }
  return `<div class="art" aria-hidden="true">${h}</div>`;
}

function card(c, i) {
  return `
    <a class="case" href="${c.href}">
      <div class="cover">${art(c.colors, i + 1)}
        <span class="label">${c.type}</span>
        <span class="brand${c.dark ? " dark" : ""}">${c.brand}</span>
      </div>
      <div class="body">
        <span class="q-label">The question</span>
        <p class="q">${c.question}</p>
        <h3>${c.title}</h3>
      </div>
    </a>`;
}

document.getElementById("catJump").innerHTML = CATEGORIES.map((g) => {
  const n = CASES.filter((c) => c.category === g.id).length;
  return n
    ? `<a href="#cat-${g.id}">${g.name}<b>${n}</b></a>`
    : `<span class="off" aria-disabled="true">${g.name}<b>${n}</b></span>`;
}).join("");

document.getElementById("cats").innerHTML = CATEGORIES.map((g, gi) => {
  const list = CASES.filter((c) => c.category === g.id);
  const cards = list.length
    ? list.map((c) => card(c, CASES.indexOf(c))).join("")
    : `<div class="case soon"><b>Coming soon</b><p>First up in this group: ${g.next}.</p></div>`;
  return `
    <section class="cat" id="cat-${g.id}">
      <div class="cat-head">
        <div>
          <span class="eyebrow e-${g.color}">${String(gi + 1).padStart(2, "0")} · ${list.length} ${list.length === 1 ? "case" : "cases"}</span>
          <h2>${g.name}</h2>
        </div>
        <div><p>${g.blurb}</p></div>
      </div>
      <div class="lib">${cards}</div>
    </section>`;
}).join("");
</script>
</body>
</html>
