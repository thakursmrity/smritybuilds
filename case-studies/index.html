<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case study library · smritybuilds</title>
<meta name="description" content="Product strategy case studies by Smrity, each worked from diagnosis to rollout.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><clipPath id='r'><rect width='64' height='64' rx='5'/></clipPath><g clip-path='url(%23r)'><rect width='64' height='64' fill='%235B3FA6'/><path d='M50 0 A50 50 0 0 0 0 50 L0 64 L64 64 L64 0 Z' fill='%23D6C8F7'/><circle cx='43' cy='43' r='12' fill='%23FFFFFF'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">

</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="../#home" aria-label="Smrity builds, home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><clipPath id="mk"><rect width="64" height="64" rx="5"/></clipPath><g clip-path="url(#mk)"><rect width="64" height="64" fill="#5B3FA6"/><path d="M50 0 A50 50 0 0 0 0 50 L0 64 L64 64 L64 0 Z" fill="#D6C8F7"/><circle cx="43" cy="43" r="12" fill="#FFFFFF"/></g></svg>
      <span>smritybuilds</span>
    </a>
    <nav class="nav" aria-label="Pages">
      <a href="../#home">Home</a><a href="../#work">Work</a><a href="../#builds" aria-current="page">Builds</a><a href="../#becoming">Becoming</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="lib-head">
    <div>
      <a class="crumb" href="../#builds">← Builds</a><br>
      <span class="eyebrow e-lilac">Case study library</span>
      <h1>How I think through products</h1>
    </div>
    <p>Each case is worked the same way: diagnose the metric, pick a segment, prioritize the pain, then design, measure and roll out. Choose one to read the full case.</p>
  </div>

  <div class="filters" id="filters" role="group" aria-label="Filter case studies"></div>
  <div class="lib" id="lib"></div>
</main>

<footer><div class="wrap">Smrity · smritybuilds.com</div></footer>

<script>
/* ============================================================
   CASE STUDIES: add a new object here and it appears as a card.
   Each one opens its own page from `href`.
   ============================================================ */
const CASES = [
  {
    brand: "Zomato",
    title: "Bringing back the weekday lunch",
    type: "Product strategy",
    summary: "Orders per user were falling while users kept growing. A strategy to win back lapsing professionals at weekday lunch, with two solutions: one that removes the daily decision, and one that lowers the daily cost.",
    tags: ["Food delivery", "Order frequency", "Consumer"],
    colors: ["rose", "peach", "butter"],
    href: "zomato-lunch-frequency.html",
    deck: "zomato-lunch-frequency.pdf"
  }
];

const C = (k) => `var(--${k})`;
const SHAPES = ["s-quarter", "s-half", "s-circle", "s-tri", "s-leaf"];
const pick = (a, i) => a[i % a.length];
function art(colors, seed) {
  let h = "";
  for (let k = 0; k < 9; k++) {
    const bg = colors[k % 3], fg = colors[(k + 1) % 3];
    const flip = pick(["none", "rotate(180deg)", "scaleX(-1)", "scaleY(-1)"], k * 7 + seed);
    h += `<div class="${pick(SHAPES, k * 3 + seed)}" style="background:${C(bg)};transform:${flip}"><i style="background:${C(fg)}"></i></div>`;
  }
  return `<div class="art" aria-hidden="true">${h}</div>`;
}

const types = ["All", ...new Set(CASES.map((c) => c.type))];
let active = "All";
const filters = document.getElementById("filters");
const lib = document.getElementById("lib");

function render() {
  filters.innerHTML = types.map((t) => `<button type="button" aria-pressed="${t === active}">${t}</button>`).join("");
  [...filters.children].forEach((b, i) => b.addEventListener("click", () => { active = types[i]; render(); }));
  const shown = CASES.filter((c) => active === "All" || c.type === active);
  lib.innerHTML = shown.map((c, i) => `
    <a class="case" href="${c.href}">
      <div class="cover">${art(c.colors, i + 1)}
        <span class="label">${c.type}</span>
        <span class="brand">${c.brand}</span>
      </div>
      <div class="body">
        <h3>${c.title}</h3>
        <p>${c.summary}</p>
        <div class="meta">${c.tags.map((t) => `<span>${t}</span>`).join("")}</div>
        <span class="go">Read the case →</span>
      </div>
    </a>`).join("") + `
    <a class="case note" href="../#work">
      <div><span class="eyebrow e-butter" style="background:#fff">From Xorosoft</span>
      <h3>Work case studies</h3>
      <p style="margin-top:8px">Workflow automation, demand forecasting, migrations and customer operations live on the Work page, each in the same five part shape.</p></div>
      <span class="go" style="font-weight:600">See them on Work →</span>
    </a>`;
}
render();
</script>
</body>
</html>
